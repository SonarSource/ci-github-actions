---
name: Authenticate to SonarQube Cloud
description: >-
  Internal action used by the build-* actions. Requests short-lived SonarQube Cloud tokens (EU and US)
  with the GitHub OIDC token of the job by default, or legacy Vault tokens when secretless is false.
  Requires the id-token write permission.

inputs:
  secretless:
    description: Use WIF ('true') or legacy Vault tokens ('false') for SonarQube Cloud
    default: 'true'
  sonar-project-key:
    description: >-
      Key of the SonarQube Cloud project to request the WIF token for. Required when the repository is bound to several projects.
      Ignored when secretless is 'false'.
    default: ''
  sonar-platform:
    description: Sonar platform analyzed by the build (next, sqc-us, sqc-eu or none)
    required: true
  run-shadow-scans:
    description: Whether the build analyzes all platforms
    required: true

outputs:
  sqc-eu-token:
    description: Token to analyze the project on SonarQube Cloud EU
    value: >-
      ${{ inputs.secretless == 'true' && steps.sqc-eu-auth.outputs.sonar-token ||
        fromJSON(steps.legacy-auth.outputs.vault || '{}').SQC_EU_TOKEN }}
  sqc-us-token:
    description: Token to analyze the project on SonarQube Cloud US
    value: >-
      ${{ inputs.secretless == 'true' && steps.sqc-us-auth.outputs.sonar-token ||
        fromJSON(steps.legacy-auth.outputs.vault || '{}').SQC_US_TOKEN }}

runs:
  using: composite
  steps:
    - name: Validate secretless input
      shell: bash
      env:
        SECRETLESS: ${{ inputs.secretless }}
      run: |
        case "$SECRETLESS" in
          true|false) ;;
          *) echo '::error::secretless must be true or false' >&2; exit 1 ;;
        esac
    - uses: SonarSource/vault-action-wrapper@20728776e291b4027acb3618091a31fa15c61a30 # 3.9.0
      id: legacy-auth
      if: >-
        inputs.secretless == 'false' && (inputs.run-shadow-scans == 'true' ||
        inputs.sonar-platform == 'sqc-eu' || inputs.sonar-platform == 'sqc-us')
      with:
        # yamllint disable rule:line-length
        secrets: |
          ${{ (inputs.sonar-platform == 'sqc-eu' || inputs.run-shadow-scans == 'true') && 'development/kv/data/sonarcloud token | SQC_EU_TOKEN;' || '' }}
          ${{ (inputs.sonar-platform == 'sqc-us' || inputs.run-shadow-scans == 'true') && 'development/kv/data/sonarqube-us token | SQC_US_TOKEN;' || '' }}
        # yamllint enable rule:line-length
    - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
      id: sqc-eu-auth
      if: inputs.secretless == 'true' && (inputs.run-shadow-scans == 'true' || inputs.sonar-platform == 'sqc-eu')
      with:
        project-key: ${{ inputs.sonar-project-key }}
        export-env: 'false'
    - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
      id: sqc-us-auth
      if: inputs.secretless == 'true' && (inputs.run-shadow-scans == 'true' || inputs.sonar-platform == 'sqc-us')
      with:
        sonar-region: us
        project-key: ${{ inputs.sonar-project-key }}
        export-env: 'false'
