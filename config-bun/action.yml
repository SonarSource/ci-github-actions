---
name: Config Bun
description: GitHub Action to configure Bun dependency resolution with Artifactory authentication and caching
inputs:
  working-directory:
    description: Relative path under github.workspace containing bun.lock
    default: .
  artifactory-reader-role:
    description: Suffix for the Artifactory reader role in Vault. Defaults to `private-reader` for private repositories, and `public-reader`
      for public repositories.
    default: ''
  repox-url:
    description: URL for Repox used to resolve dependencies. Defaults to SaaS on GitHub-hosted runners and the production Edge
      on self-hosted runners. Explicit URLs override runner selection.
    default: ${{ runner.environment == 'github-hosted' && 'https://repox.jfrog.io' || 'https://repox-internal.sonar.build' }}
  disable-caching:
    description: Whether to disable Bun install caching entirely
    default: 'false'
  host-actions-root:
    description: Path to the actions folder on the host (used when called from another local action)
    default: ''

outputs:
  registry:
    description: The npm registry URL selected for Bun. Also set as environment variable BUN_CONFIG_REGISTRY.
    value: ${{ steps.config.outputs.registry }}

runs:
  using: composite
  steps:
    - id: config-bun-completed
      if: env.CONFIG_BUN_COMPLETED != ''
      shell: bash
      run: |
        echo "Action already called by $CONFIG_BUN_COMPLETED, execution skipped."
        echo "skip=true" >> "$GITHUB_OUTPUT"

    - name: Set local action paths
      if: steps.config-bun-completed.outputs.skip != 'true'
      shell: bash
      env:
        ARTIFACTORY_READER_ROLE: ${{ inputs.artifactory-reader-role != '' && inputs.artifactory-reader-role ||
          (github.event.repository.visibility == 'public' && 'public-reader' || 'private-reader') }}
      run: |
        ACTION_PATH_CONFIG_BUN="${{ github.action_path }}"
        host_actions_root="${{ inputs.host-actions-root }}"
        if [[ -n "$host_actions_root" ]]; then
          ACTION_PATH_CONFIG_BUN="$host_actions_root/config-bun"
        fi
        echo "ACTION_PATH_CONFIG_BUN=$ACTION_PATH_CONFIG_BUN" >> "$GITHUB_ENV"
        echo "ARTIFACTORY_READER_ROLE=${ARTIFACTORY_READER_ROLE}" >> "$GITHUB_ENV"

    - uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
      if: steps.config-bun-completed.outputs.skip != 'true'
      id: secrets
      with:
        # yamllint disable rule:line-length
        url: ${{ contains(inputs.repox-url, '.dev.sonar.build') && 'https://vault.dev.sonar.build' || 'https://vault.sonar.build' }}
        secrets: |
          development/${{ contains(inputs.repox-url, 'jfrog.io') && 'artifactory' || (contains(inputs.repox-url, '.dev.sonar.build') && 'artifactory-edge-dev' || 'artifactory-edge-prod') }}/token/{REPO_OWNER_NAME_DASH}-${{ env.ARTIFACTORY_READER_ROLE }} username | ARTIFACTORY_USERNAME;
          development/${{ contains(inputs.repox-url, 'jfrog.io') && 'artifactory' || (contains(inputs.repox-url, '.dev.sonar.build') && 'artifactory-edge-dev' || 'artifactory-edge-prod') }}/token/{REPO_OWNER_NAME_DASH}-${{ env.ARTIFACTORY_READER_ROLE }} access_token | ARTIFACTORY_ACCESS_TOKEN;
        # yamllint enable rule:line-length

    - name: Configure Bun registry
      id: config
      if: steps.config-bun-completed.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTIFACTORY_URL: ${{ format('{0}/artifactory', inputs.repox-url) }}
        ARTIFACTORY_USERNAME: ${{ steps.secrets.outputs.vault && fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME || '' }}
        ARTIFACTORY_ACCESS_TOKEN: ${{ steps.secrets.outputs.vault && fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN || '' }}
      run: $ACTION_PATH_CONFIG_BUN/bun_config.sh

    - name: Cache Bun dependencies
      uses: SonarSource/gh-action_cache@141f879febb7781981b1e091927d8125cff2c145 # v1.7.4
      if: steps.config-bun-completed.outputs.skip != 'true' && inputs.disable-caching != 'true'
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
        restore-keys: bun-${{ runner.os }}-

    - name: Set Config Bun completed
      if: steps.config-bun-completed.outputs.skip != 'true'
      shell: bash
      run: echo "CONFIG_BUN_COMPLETED=$GITHUB_ACTION" >> "$GITHUB_ENV"
