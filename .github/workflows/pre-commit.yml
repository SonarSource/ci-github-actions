on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - branch-*

name: pre-commit

jobs:
  pre-commit:
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/mise-action-wrapper@v1
      - uses: SonarSource/gh-action_pre-commit@v2
